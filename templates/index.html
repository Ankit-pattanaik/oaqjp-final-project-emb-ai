<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
    <style>
        .center-heading {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-body">
            <h1 class="center-heading">NLP - Emotion Detection</h1>

            <div style="padding: 25px;">
                <h2 class="mb-3">
                    <label class="form-label" for="textToAnalyze">Please enter the text to be analyzed</label>
                </h2>
                <textarea class="form-control" id="textToAnalyze" rows="3"></textarea>
            </div>

            <div style="padding: 0 25px 25px 25px;">
                <button onclick="RunEmotionDetection()" class="btn btn-secondary">Run Emotion Detection</button>
            </div>

            <div style="padding: 0 25px;">
                <h2 class="mb-3">
                    <label class="form-label">Result of Emotion Detection</label>
                </h2>
                <div id="system_response" style="padding: 25px 0;"></div>
            </div>
        </div>
    </div>
</body>
</html>
